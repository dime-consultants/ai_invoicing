# /etc/nginx/sites-available/invoicing
# Host Nginx — terminates SSL, forwards everything to Docker Nginx on port 8000

server {
    listen 80;
    listen [::]:80;
    server_name invoicing.dimeconsultants.africa;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name invoicing.dimeconsultants.africa;

    ssl_certificate     /etc/letsencrypt/live/invoicing.dimeconsultants.africa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/invoicing.dimeconsultants.africa/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header X-Frame-Options           "DENY"              always;
    add_header X-XSS-Protection          "1; mode=block"     always;

    # WebSocket — Django Channels (chat + notifications). Must be its own
    # location: the catch-all below applies a flat 370s proxy_read_timeout,
    # sized for the synchronous chat-send request path — but a WS connection
    # isn't request/response, it stays open across an entire conversation
    # and can legitimately sit idle far longer than that (a slow turn, or
    # just a user reading before replying) with no traffic to reset the
    # clock. This is the outermost hop in front of Docker Nginx, so its
    # timeout is the one that actually applies end to end — match Docker
    # Nginx's own /ws/ block (86400s) here, otherwise that inner timeout is
    # moot.
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_connect_timeout 370s;
        proxy_send_timeout    86400s;
        proxy_read_timeout    86400s;
    }

    # Forward everything else to Docker Nginx (handles static, media, api, admin)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_connect_timeout 370s;
        proxy_send_timeout    370s;
        proxy_read_timeout    370s;
    }
}