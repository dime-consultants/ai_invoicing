# Add this file to /etc/nginx/sites-available/invoicing on your VPS
# then: ln -s /etc/nginx/sites-available/invoicing /etc/nginx/sites-enabled/
# then: certbot --nginx -d invoicing.dimeconsultants.africa

server {
    listen 80;
    listen [::]:80;
    server_name invoicing.dimeconsultants.africa;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name invoicing.dimeconsultants.africa;

    ssl_certificate     /etc/letsencrypt/live/invoicing.dimeconsultants.africa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/invoicing.dimeconsultants.africa/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"    always;
    add_header X-Frame-Options           "DENY"       always;
    add_header X-XSS-Protection          "1; mode=block" always;

    location / {
        proxy_pass http://127.0.0.1:6081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}