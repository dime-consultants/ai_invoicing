upstream invoicing_app {
    server app:8000;
}

server {
    listen 80;
    server_name invoicing.dimeconsultants.africa;

    # Static files — served directly by Nginx from Docker volume
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media files — served directly by Nginx from Docker volume
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }

    # WebSocket — Django Channels
    location /ws/ {
        proxy_pass http://invoicing_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }

    # All other requests (API, admin, health) → Daphne
    location / {
        proxy_pass http://invoicing_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        client_max_body_size  50M;
    }

    # Block dotfiles (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}