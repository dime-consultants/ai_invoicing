upstream invoicing_app {
    server app:8000;
}

server {
    listen 80;
    server_name invoicing.dimeconsultants.africa;

    # Static files — served directly by Nginx from Docker volume
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media files — served directly by Nginx from Docker volume
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }

    # WebSocket — Django Channels
    location /ws/ {
        proxy_pass http://invoicing_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }

    # Chat send/process endpoints — these block briefly on a Celery result
    # (see chat/views.py:_run_turn_via_worker, CHAT_SYNC_RESULT_TIMEOUT in
    # settings.py, default 45s) instead of the default 60s below, which was
    # killing large-file chat requests outright with no response at all.
    # Kept just above the app's own bound so Django gets to return its
    # graceful "still processing" error before nginx would cut the
    # connection anyway.
    location ~* ^/api/chat/(conversations/.*/send/|message/|process-file/|convert-format/) {
        proxy_pass http://invoicing_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    75s;
        client_max_body_size  50M;
    }

    # All other requests (API, admin, health) → Daphne
    location / {
        proxy_pass http://invoicing_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        client_max_body_size  50M;
    }

    # Block dotfiles (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}