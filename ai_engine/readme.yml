### GET `/api/ai/insights/recent/`

Most recent AI insights across all jobs (latest 10), shaped for the AI Engine page.

**Response `200`**
```json
{
  "insights": [
    {
      "id": 5,
      "title": "Zero Tax Amount",
      "description": "Invoice INV-002 has a tax amount of 0.",
      "severity": "warning",
      "source": "Anomaly",
      "created_at": "2026-07-29T14:09:25.694777+03:00"
    }
  ]
}
```

`severity` values: `"error"` (critical), `"warning"`, `"success"` (info).

