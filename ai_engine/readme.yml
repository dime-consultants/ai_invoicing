### POST `/api/ai/jobs/<id>/requeue/`

Reset a `done` or `error` job back to `queued` and re-dispatch via Celery. Clears all previous insights and tool calls.

> **Requires Redis + Celery worker running.**

**Request** — empty body `{}`

**Response `200`** — full job detail with `status: "queued"`.

**Response `400`**
```json
{"error": "Cannot requeue a job with status 'running'."}
```

**Response `404`** — job not found.

