## Insights

### GET `/api/ai/jobs/<job_id>/insights/`

All insights produced by a specific job.

**Query parameters**

| Param | Example | Description |
|---|---|---|
| `severity` | `?severity=critical` | `critical`, `warning`, `info` |
| `type` | `?type=anomaly` | `anomaly`, `variance_explanation`, `summary_point`, `classification`, `recommendation` |
| `actioned` | `?actioned=false` | `true` or `false` |

**Response `200`** — array:
```json
[
  {
    "id": 5,
    "insight_type": "anomaly",
    "insight_type_display": "Anomaly",
    "severity": "warning",
    "severity_display": "Warning",
    "reference_key": "INV-002",
    "title": "Zero Tax Amount",
    "detail": "Invoice INV-002 has tax amount of 0 on a gross of 12000.",
    "source_tool_call": 3,
    "is_actioned": false,
    "actioned_by_username": null,
    "actioned_at": null,
    "resolution_note": "",
    "created_at": "2026-07-29T14:12:50.500000+03:00"
  }
]
```

