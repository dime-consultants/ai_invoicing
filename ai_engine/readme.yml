## Jobs

### GET `/api/ai/jobs/`

List all jobs belonging to the authenticated user, newest first.

**Query parameters**

| Param | Example | Description |
|---|---|---|
| `status` | `?status=done` | Filter by status: `queued`, `running`, `done`, `error` |
| `task_type` | `?task_type=flag_anomalies` | Filter by task type (see values below) |
| `batch` | `?batch=2` | Filter by batch id |

**Task type values**

| Value | Label |
|---|---|
| `detect_and_extract` | Detect & Extract |
| `reconcile` | Reconcile |
| `summarise_batch` | Summarise Batch |
| `flag_anomalies` | Flag Anomalies |
| `explain_variance` | Explain Variance |
| `classify_lines` | Classify Line Items |
| `generate_report` | Generate Report |
| `custom` | Custom Prompt |

**Response `200`** — array of job list objects:
```json
[
  {
    "id": 2,
    "task_type": "flag_anomalies",
    "task_type_display": "Flag Anomalies",
    "status": "done",
    "status_display": "Done",
    "batch": 1,
    "batch_label": "April 10–16 upload",
    "target_file": null,
    "target_filename": null,
    "requested_by_username": "user@example.com",
    "user_intent": "Flag any receipts where tax amount is zero or negative.",
    "input_tokens": 420,
    "output_tokens": 88,
    "total_tokens": 508,
    "duration_seconds": 18.4,
    "insight_count": 3,
    "tool_call_count": 4,
    "created_at": "2026-07-29T14:12:31.433400+03:00",
    "started_at": "2026-07-29T14:12:32.100000+03:00",
    "finished_at": "2026-07-29T14:12:50.500000+03:00"
  }
]
```

