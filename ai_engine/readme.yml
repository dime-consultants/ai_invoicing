## AI Engine

### GET `/api/ai/models/`

List available AI models and their status.

**Response `200`**
```json
{
  "models": [
    {
      "id": "grok-3",
      "name": "Grok 3",
      "description": "xAI Grok 3 — primary model for invoice extraction, reconciliation, and anomaly detection.",
      "status": "active",
      "accuracy": 94.5,
      "lastTrained": "2025-01-01T00:00:00Z"
    },
    {
      "id": "grok-3-mini",
      "name": "Grok 3 Mini",
      "description": "Faster, lighter model for classification and quick summaries.",
      "status": "active",
      "accuracy": 91.2,
      "lastTrained": "2025-01-01T00:00:00Z"
    }
  ]
}
```

`status` is `"active"` when `XAI_API_KEY` is configured, `"inactive"` otherwise.

---

### GET `/api/ai/stats/`

Headline stats for the AI Engine dashboard.

**Response `200`**
```json
{
  "analyses_today": 4,
  "analyses_today_delta_pct": 33,
  "insights_this_week": 12,
  "avg_processing_seconds": 18.4
}
```

| Field | Description |
|---|---|
| `analyses_today` | Jobs created today |
| `analyses_today_delta_pct` | % change vs yesterday (`null` if no jobs yesterday) |
| `insights_this_week` | Insights generated in the last 7 days |
| `avg_processing_seconds` | Average job runtime over the last 200 completed jobs |

