## Local Dev Notes

**What works without Redis/Celery:**
- `GET /api/ai/models/`, `GET /api/ai/stats/`, `GET /api/ai/insights/recent/`
- `POST /api/ai/analyze/` — runs Grok inline, no queue
- `POST /api/ai/run/` — runs Grok inline via `handle_chat_message`, no queue
- All `GET` endpoints for jobs, insights, batches

**What requires Redis + Celery:**
- `POST /api/ai/jobs/` — will 500 without Redis
- `POST /api/ai/jobs/<id>/requeue/` — will 500 without Redis
- WebSocket job notifications

**Start Redis + Celery locally (WSL or Docker recommended on Windows):**
```bash
# Terminal 1 — Redis
docker run -p 6379:6379 redis:7-alpine

# Terminal 2 — Celery worker
cd ai_invoicing
source .venv/Scripts/activate
celery -A config worker --loglevel=info --pool=solo   # --pool=solo required on Windows
```