## WebSocket Notifications

Jobs push real-time status updates over WebSocket when Celery transitions them between states. The frontend should connect on login and listen for two event types.

**Connection URL**
```
ws://localhost:8000/ws/notifications/
```
(Include the JWT token per your WS middleware — check `config/ws_middleware.py` for the exact mechanism.)

**Event: job status update**
```json
{
  "type": "job_update",
  "job_id": 2,
  "status": "done",
  "title": "Flag Anomalies — done"
}
```

**Event: job complete toast**
```json
{
  "type": "notification",
  "title": "AI Job Complete",
  "message": "AI job 'Flag Anomalies' completed. 3 insights generated."
}
```

**Event: job failed toast**
```json
{
  "type": "notification",
  "title": "AI Job Failed",
  "message": "'Flag Anomalies' failed: XAI_API_KEY is not set in settings / .env"
}
```

> WS events are only fired when Celery + Redis are running. Without them, poll `GET /api/ai/jobs/<id>/` on an interval instead.

