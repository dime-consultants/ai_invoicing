## Error Reference

| Status | Meaning |
|---|---|
| `400` | Validation error — check the response body for field-level errors |
| `401` | Missing or expired token — re-login |
| `403` | Authenticated but not authorised for this resource |
| `404` | Resource not found or belongs to another user |
| `500` | Server error — most commonly Redis/Celery unavailable when dispatching jobs |

