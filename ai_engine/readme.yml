## Batch Shortcut

### GET `/api/ai/batches/<batch_id>/jobs/`

All jobs for a specific batch. Equivalent to `GET /api/ai/jobs/?batch=<id>` but scoped directly to the batch.

**Response `200`** — same shape as `GET /api/ai/jobs/`.

