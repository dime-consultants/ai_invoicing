### POST `/api/ai/insights/<id>/action/`

Mark an insight as actioned by the current user.

**Request**
```json
{
  "resolution_note": "Reviewed with finance lead — zero-tax invoices are for exempt goods."
}
```

`resolution_note` is optional.

**Response `200`** — full insight object with `is_actioned: true`, `actioned_at`, `actioned_by_username`, and `resolution_note` populated.

**Response `400`**
```json
{"error": "Insight is already actioned."}
```

**Response `403`** — insight belongs to another user's job.

**Response `404`** — insight not found.

