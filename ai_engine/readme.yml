# AI Invoicing — Frontend API Reference

**Base URL:** `http://localhost:8000` (dev) / `https://invoicing.dimeconsultants.africa` (prod)  
**Auth:** All endpoints require `Authorization: Bearer <token>` except `/api/auth/login/`  
**Content-Type:** `application/json` on all POST requests

---

## Authentication

### POST `/api/auth/login/`

Obtain a JWT access token.

**Request**
```json
{
  "email": "user@example.com",
  "password": "yourpassword"
}
```

**Response `200`**
```json
{
  "message": "Welcome back user@example.com",
  "token": "<jwt_access_token>",
  "user": {
    "id": 1,
    "username": "user@example.com",
    "email": "user@example.com",
    "first_name": "Luther",
    "last_name": "Isaboke",
    "name": "Luther Isaboke",
    "role": "admin",
    "role_display": "Admin",
    "status": "active",
    "lastActive": "2026-07-29T11:48:56.399630+03:00",
    "department": "",
    "phone": "",
    "is_active": true,
    "created_at": "2026-07-29T11:48:56.399568+03:00"
  }
}
```

**Response `400`** — wrong credentials.

> Store the `token` value and send it as `Authorization: Bearer <token>` on every subsequent request.

