### POST `/api/ai/analyze/`

Run a one-shot AI analysis on arbitrary data without creating a job or uploading files. Useful for quick checks from the UI.

**Request**
```json
{
  "modelId": "grok-3",
  "data": {
    "invoices": [
      {"id": "INV-001", "amount": 5000, "tax": 800},
      {"id": "INV-002", "amount": 12000, "tax": 0}
    ]
  },
  "options": {
    "includeConfidence": true,
    "threshold": 0.5
  }
}
```

| Field | Required | Description |
|---|---|---|
| `modelId` | No | `"grok-3"` (default) or `"grok-3-mini"` |
| `data` | **Yes** | Any JSON object — invoice lines, batch summaries, etc. |
| `options.includeConfidence` | No | Include confidence scores (default `true`) |
| `options.threshold` | No | Drop results below this confidence (default `0.7`) |

**Response `200`**
```json
{
  "results": [
    {
      "id": "INV-001",
      "prediction": "Total including tax: 5800",
      "confidence": 0.9,
      "metadata": {
        "tax_rate": 0.16,
        "total": 5800
      }
    }
  ]
}
```

**Response `400`** — `data` field missing.

> On AI service failure the endpoint returns a graceful fallback result with `confidence: 0.0` rather than a 500, so the UI always gets a parseable response.

