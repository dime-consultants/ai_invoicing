### POST `/api/ai/run/`

Full agent analysis. Finds the user's most recently uploaded batch, runs Grok with the appropriate tools, and returns a summary, insights, tools used, and download links for any output files produced.

**Request**
```json
{
  "context": "Extract all URA receipts and flag any with zero tax.",
  "pipeline": "ura_processing"
}
```

| Field | Required | Description |
|---|---|---|
| `context` | **Yes** | Natural-language instruction for the AI |
| `pipeline` | No | Hint for which tool set to use. One of: `ura_processing`, `safaricom_processing`, `acon_processing`, `reconciliation`, `classification`, `report_generation` |

**Response `200`**
```json
{
  "job_id": 1,
  "summary": "Processed 3 URA receipts. Found 1 anomaly: INV-003 has zero tax.",
  "batch": "April 10–16 upload",
  "batch_id": 2,
  "insights": [
    {
      "insight_type": "anomaly",
      "severity": "warning",
      "title": "Zero Tax Amount",
      "detail": "INV-003 has tax=0 on amount=45000"
    }
  ],
  "tools_used": [
    {"tool__name": "detect_file_type", "status": "success"},
    {"tool__name": "extract_ura_receipts", "status": "success"},
    {"tool__name": "flag_anomalies", "status": "success"}
  ],
  "output_files": [
    {
      "filename": "anomaly_report.xlsx",
      "download_url": "http://localhost:8000/api/chat/attachments/3/download/",
      "content_type": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    }
  ]
}
```

> If the user has no uploaded files, `batch` and `batch_id` are `null` and Grok responds conversationally without calling file tools.

**Response `400`** — `context` missing.  
**Response `500`** — AI service error.

