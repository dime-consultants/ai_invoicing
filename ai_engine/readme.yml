### POST `/api/ai/jobs/`

Create a new job and dispatch it via Celery. Returns immediately in `queued` status — poll `GET /api/ai/jobs/<id>/` or listen on the WebSocket for status updates.

> **Requires Redis + Celery worker running.** Returns `500` if Redis is unavailable.

**Request**
```json
{
  "batch": 1,
  "target_file": 3,
  "task_type": "flag_anomalies",
  "user_intent": "Flag any receipts where tax amount is zero or negative.",
  "system_prompt": ""
}
```

| Field | Required | Description |
|---|---|---|
| `batch` | **Yes** | ID of the `UploadBatch` to process |
| `target_file` | No | ID of a specific `UploadedFile` within the batch |
| `task_type` | **Yes** | One of the task type values above |
| `user_intent` | No | Natural-language description of what to do |
| `system_prompt` | No | Override the default system prompt |

**Response `201`** — full job detail object (same shape as `GET /api/ai/jobs/<id>/`).

