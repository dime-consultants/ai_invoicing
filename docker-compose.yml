services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: invoicing-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - invoicing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  # Shared by both Django Channels (WebSocket notifications) and Celery
  # (broker + result backend for async file processing).
  redis:
    image: redis:7-alpine
    container_name: invoicing-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - invoicing-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320M

  # ── Migrations & collectstatic (one-shot, runs then exits) ─────────────────
  migrate:
    image: ${IMAGE_NAME:-ghcr.io/kib4n4/ai_invoicing}:${IMAGE_TAG:-latest}
    container_name: invoicing-migrate
    restart: "no"
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - invoicing-network
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput"

  # ── Django / Daphne (web) ────────────────────────────────────────────────────
  app:
    image: ${IMAGE_NAME:-ghcr.io/kib4n4/ai_invoicing}:${IMAGE_TAG:-latest}
    container_name: invoicing-app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      DEBUG: "False"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      - outputs_files:/app/outputs     # shared with worker — see note below
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - invoicing-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Celery worker ────────────────────────────────────────────────────────────
  # Consumes ai_engine/tasks.py:run_ai_job_task jobs queued via .delay() from
  # chat/services.py (large files) and ai_engine/views.py (job-create endpoint).
  # MUST share the same media + outputs volumes as `app` — it reads uploaded
  # files from /app/media and writes extraction output (xlsx/pdf/csv) to
  # /app/outputs/converted/, which `app` then reads back when persisting
  # ChatMessageAttachment records.
  worker:
    image: ${IMAGE_NAME:-ghcr.io/kib4n4/ai_invoicing}:${IMAGE_TAG:-latest}
    container_name: invoicing-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      DEBUG: "False"
    volumes:
      - media_files:/app/media
      - outputs_files:/app/outputs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - invoicing-network
    command: >
      celery -A config worker
      --loglevel=info
      --concurrency=2
      --max-tasks-per-child=20
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Celery monitoring (optional but cheap — recommended while you stabilise this) ─
  # Web UI at http://<host>:5555 showing live task status, failures, retries.
  # Safe to delete this service later once things are stable; no other
  # service depends on it.
  flower:
    image: ${IMAGE_NAME:-ghcr.io/kib4n4/ai_invoicing}:${IMAGE_TAG:-latest}
    container_name: invoicing-flower
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - invoicing-network
    command: celery -A config flower --port=5555
    ports:
      - "5555:5555"

  # ── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: invoicing-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/invoicing.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - invoicing-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
  outputs_files:

networks:
  invoicing-network:
    driver: bridge