services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: invoicing-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - invoicing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: invoicing-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - invoicing-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320M

  # ── Migrations + seed (one-shot, runs then exits) ───────────────────────────
  #
  # Runs in order:
  #   1. migrate          — apply any pending Django migrations
  #   2. seed_tools       — upsert builtin + prompt_transform ToolDefinitions
  #                         and write /app/tools_export.json for the frontend
  #   3. collectstatic    — gather static assets into /app/staticfiles
  #
  # register_tools and sync_tools_to_ui are removed — seed_tools replaces both.
  # seed_tools is idempotent: re-running on deploy only updates changed rows.
  migrate:
    image: ${IMAGE_NAME:-ghcr.io/kib4n4/ai_invoicing}:${IMAGE_TAG:-latest}
    container_name: invoicing-migrate
    restart: "no"
    env_file: .env
    environment:
      DB_HOST:   db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - invoicing-network
    volumes:
      - tools_export:/app  # shares tools_export.json with app container
    command: >
      sh -c "
        echo '[migrate] Applying migrations...' &&
        python manage.py migrate --noinput &&
        echo '[migrate] Seeding tools...' &&
        python manage.py seed_tools --export /app/tools_export.json &&
        echo '[migrate] Collecting static files...' &&
        python manage.py collectstatic --noinput &&
        echo '[migrate] Done.'
      "

  # ── Django / Daphne (web) ───────────────────────────────────────────────────
  app:
    image: ${IMAGE_NAME:-ghcr.io/kib4n4/ai_invoicing}:${IMAGE_TAG:-latest}
    container_name: invoicing-app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST:            db
      REDIS_URL:          redis://redis:6379/0
      DEBUG:              "False"
      # Entrypoint skips startup tasks — migrate service handled them
      RUN_STARTUP_TASKS:  "false"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      - outputs_files:/app/outputs
      - tools_export:/app/tools_export_shared  # read tools_export.json if needed
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - invoicing-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Celery worker ────────────────────────────────────────────────────────────
  #
  # Shares media_files and outputs_files with `app`:
  #   - reads uploaded files from /app/media (written by the web process)
  #   - writes extracted xlsx/csv to /app/outputs/converted/ (read back by web
  #     process when persisting ChatMessageAttachment records)
  #
  # Does NOT run startup tasks — migrations + seeding happen in `migrate`.
  worker:
    image: ${IMAGE_NAME:-ghcr.io/kib4n4/ai_invoicing}:${IMAGE_TAG:-latest}
    container_name: invoicing-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST:   db
      REDIS_URL: redis://redis:6379/0
      DEBUG:     "False"
    volumes:
      - media_files:/app/media
      - outputs_files:/app/outputs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - invoicing-network
    command: >
      celery -A config worker
      --loglevel=info
      --concurrency=2
      --max-tasks-per-child=20
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Flower (Celery monitoring) ───────────────────────────────────────────────
  # Web UI at http://<host>:5555 — safe to remove once things are stable.
  flower:
    image: ${IMAGE_NAME:-ghcr.io/kib4n4/ai_invoicing}:${IMAGE_TAG:-latest}
    container_name: invoicing-flower
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - invoicing-network
    command: celery -A config flower --port=5555
    ports:
      - "5555:5555"

  # ── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: invoicing-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/invoicing.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
    depends_on:
      app:
        condition:
         service_healthy
    networks:
      - invoicing-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
  outputs_files:
  tools_export:     # carries tools_export.json from migrate → app

networks:
  invoicing-network:
    driver: bridge