environment_name: dime
server_name: dime
server_aliases:
  - invoicing
kubernetes_namespaces:
  - prod
  - stage

ssh_secret_name: INVOICING_SSH_KEY
ssh_user_secret_name: INVOICING_SSH_USER
public_ip_secret_name: INVOICING_PUBLIC_IP

ansible_timeout: 15
ssh_wait_delay: 0
ssh_wait_timeout: 45

ansible_ssh_common_args: >-
  -o ConnectTimeout=10
  -o ConnectionAttempts=1
  -o BatchMode=yes
  -o ServerAliveInterval=30
  -o ServerAliveCountMax=2

docker_setup_enabled: false
shared_services_deploy_enabled: false
nginx_enabled: false

migration_cleanup:
  purge_nginx_when_k3s: true
  stop_docker_when_k3s: false
  disable_docker_when_k3s: false
  uninstall_k3s_when_docker: false
  docker_prune_when_docker: false
  docker_prune_volumes_when_docker: false
  docker_prune_images_when_docker: false

k3s:
  enabled: true
  external_backend_host: 10.42.0.1
  disable:
    - metrics-server
  install_helm: false
  space_guard:
    enabled: true
    max_disk_use_percent: 82
    journal_vacuum_size: 300M
    temp_file_min_age_days: 2
    on_boot_sec: 10m
    on_unit_active_sec: 1h
    randomized_delay_sec: 10m
    run_now: true
  traefik_acme:
    enabled: true
    email: stephenosiru@gmail.com
    resolver_name: letsencrypt
    storage: /data/acme.json
  cert_manager:
    enabled: false
    install_manifest_url: https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
    cluster_issuer:
      enabled: true
      name: letsencrypt-prod
      email: stephenosiru@gmail.com
      server: https://acme-v02.api.letsencrypt.org/directory
      private_key_secret_name: letsencrypt-prod-key
      ingress_class: traefik
  firewall_ports:
    - 80
    - 443
    - 6443

firewall_extra_ports: []

docker_maintenance:
  cleanup_min_disk_use_percent: 88
  journal_vacuum_size: 300M

shared_services:
  - name: postgres
    environments:
      prod: {}
      stage: {}

  - name: rabbitmq
    environments:
      prod:
        domain: rabbitmq.dimeconsultants.africa
        ingress:
          enabled: true
          className: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
            traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
          tls:
            enabled: true
      stage: {}

k3s_portainer:
  enabled: true
  domain: portainer.dimeconsultants.africa
  namespace: portainer
  image: portainer/portainer-ce:2.39.0
  storage_size: 10Gi
  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    tls:
      enabled: true

k3s_argocd:
  enabled: true
  domain: argocd.dimeconsultants.africa
  namespace: argocd
  install_manifest_url: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    tls:
      enabled: true

k3s_grafana:
  enabled: true
  domain: grafana.dimeconsultants.africa
  namespace: grafana
  image: grafana/grafana-oss:11.1.4
  storage_size: 10Gi
  loki:
    enabled: true
    retention_period: 24h
    storage_size: 10Gi
  promtail:
    enabled: true
    positions_dir: /var/lib/promtail
    namespaces:
      - prod
      - stage
      - grafana
  admin_user_secret_name: GRAFANA_PROD_USER
  admin_password_secret_name: GRAFANA_PROD_PASSWORD
  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    tls:
      enabled: true

apps:
  - name: invoicing
    repo: dime-consultants/ai_invoicing
    deployment_type: k3s
    aliases:
      - ai_invoicing
      - invoicing.dimeconsultants.africa
      - stage-invoicing.dimeconsultants.africa
    port_env: API_PORT
    postgres_database: invoicing
    rabbitmq_namespace: invoicing
    redis:
      enabled: true
    persistentVolumeClaims:
      - name: invoicing-media
        accessModes:
          - ReadWriteOnce
        storage: 10Gi
    volumes:
      - name: media
        persistentVolumeClaim:
          claimName: invoicing-media
    volumeMounts:
      - name: media
        mountPath: /usr/src/app/media
    # Three workers now, matching docker-compose.yml's intended shape:
    # celery-worker handles default + extraction (long-running/bulk jobs),
    # celery-worker-chat is dedicated to the "chat" queue so chat turns are
    # never starved behind large-file extraction or AI jobs (see the
    # CELERY_TASK_ROUTES comment in settings.py), and celery-beat runs the
    # scheduler. Previously celery-worker had no -Q flag, so it only ever
    # consumed CELERY_TASK_DEFAULT_QUEUE ("default") — no worker was bound
    # to "chat" at all, which is why chat sends returned 202 Accepted but
    # never produced a reply.
    workers:
      - name: celery-worker
        command:
          - celery
          - -A
          - config
          - worker
          - -Q
          - extraction,default
          - -l
          - INFO
      - name: celery-worker-chat
        command:
          - celery
          - -A
          - config
          - worker
          - -Q
          - chat
          - -l
          - INFO
      - name: celery-beat
        command:
          - celery
          - -A
          - config
          - beat
          - -l
          - INFO
          - --schedule
          - /tmp/celerybeat-schedule
    secret_names:
      SECRET_KEY: DJANGO_SECRET_KEY
      # Was entirely absent from this mapping — XAI_API_KEY grep on the app
      # pod came back empty, so any chat turn that reaches the Grok call
      # will fail auth once the queue-binding fix above lets it run at all.
      # Confirm/replace INVOICING_XAI_API_KEY with whatever this key is
      # actually named in the secret store.
      XAI_API_KEY: INVOICING_XAI_API_KEY
    remove_deploy_artifacts:
      - /root/tools/ai_invoicing/image.tar
    compose_pull: missing
    compose_recreate: auto
    compose_wait_timeout: 120
    environments:
      prod:
        domain: invoicing.dimeconsultants.africa
        replicas: 2
        nginx_managed: false
        port: 9455
        container_port: 9455
        env:
          DEBUG: "False"
          DJANGO_SETTINGS_MODULE: config.settings
          SYSTEM_BASE_URL: invoicing.dimeconsultants.africa
        service:
          type: ClusterIP
          port: 80
          targetPort: 9455
        probes:
          path: /api/health
        ingress:
          enabled: true
          className: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
            traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
          tls:
            enabled: true
        k3s:
          namespace: prod
      stage:
        domain: stage-invoicing.dimeconsultants.africa
        replicas: 2
        nginx_managed: false
        port: 6001
        container_port: 6001
        env:
          DEBUG: "False"
          DJANGO_SETTINGS_MODULE: config.settings
          SYSTEM_BASE_URL: stage-invoicing.dimeconsultants.africa
        service:
          type: ClusterIP
          port: 80
