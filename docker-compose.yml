version: '3.9'

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: invoicing-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - invoicing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: invoicing-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - invoicing-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Migrations are run externally (not as a compose service) to avoid
  # blocking `docker compose up`. Run migrations on the host or CI before
  # bringing up the `app` service. Example commands:
  #   # Using the built image on the host (after loading/pulling):
  #   docker run --rm \
  #     -e DB_HOST=db -e REDIS_URL=redis://redis:6379/0 \
  #     -v /path/to/.env:/app/.env \
  #     ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/ai_invoicing:latest \
  #     sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
  #
  #   # Or, run against the service container once it's available:
  #   docker compose run --rm app python manage.py migrate --noinput
  #   docker compose run --rm app python manage.py collectstatic --noinput

  # ── Django / Daphne ─────────────────────────────────────────────────────────
  app:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/ai_invoicing:latest
    container_name: invoicing-app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      DEBUG: "False"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - invoicing-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: invoicing-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/invoicing.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - invoicing-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Tool sync is run externally (not as a compose service) to avoid deployment timeouts.
  # Run the sync command on the host or via your deployment scripts:
  #   python manage.py sync_tools_to_ui --output /path/to/tools_export.json

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:

networks:
  invoicing-network:
    driver: bridge