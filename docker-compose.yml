version: '3.9'

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: invoicing-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - invoicing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: invoicing-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - invoicing-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Django / Daphne ─────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoicing-app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      DEBUG: "False"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - invoicing-network
    healthcheck:
      # Daphne listens on 8000 inside this container
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: invoicing-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/invoicing.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - invoicing-network
    healthcheck:
      # Nginx listens on 80 inside this container, proxies to app:8000
      test: ["CMD", "wget", "-qO-", "http://localhost/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Migrations (one-shot, exits after running) ──────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoicing-migrate
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      DEBUG: "False"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - invoicing-network
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:

networks:
  invoicing-network:
    driver: bridge