name: Build Image & Trigger Deployment

on:
  push:
    branches:
      - master
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test


  build-and-trigger:
    needs: test
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: 1. Checkout Repository
        uses: actions/checkout@v4


      # 2. Prepare environment + tag + compose + secrets
      - name: 2. Prepare Deployment Metadata
        id: prepare
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          INFRA_PAT: ${{ secrets.INFRA_PAT }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: |
          # Validate required secrets
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Error: DOCKERHUB_USERNAME is missing."
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Error: DOCKERHUB_TOKEN is missing."
            exit 1
          fi

          if [ -z "$INFRA_PAT" ]; then
            echo "Error: INFRA_PAT is missing."
            exit 1
          fi


          # Determine environment
          if [[ "${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" == "master" ]]; then
            ENV_NAME="prod"
          else
            ENV_NAME="stage"
          fi


          # Generate image tag
          IMAGE_NAME="ai_invoicing"
          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")
          IMAGE_TAG="${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${ENV_NAME}-${TIMESTAMP}"


          # Validate compose
          if [ ! -f docker-compose.yml ]; then
            echo "Error: docker-compose.yml not found."
            exit 1
          fi


          # Encode compose
          COMPOSE_B64=$(base64 -w 0 docker-compose.yml)


          # Prepare environment secrets
          SECRETS_JSON="{}"

          if [ -n "$DJANGO_SECRET_KEY" ]; then
            SECRETS_JSON=$(echo "$SECRETS_JSON" | jq \
              --arg value "$DJANGO_SECRET_KEY" \
              '.DJANGO_SECRET_KEY = $value')
          fi

          if [[ "${{ steps.env.outputs.env }}" == "stage" ]]; then
            SYSTEM_BASE_URL="stage-invoicing.dimeconsultants.africa"
          else
            SYSTEM_BASE_URL="invoicing.dimeconsultants.africa"
          fi

          JSON=$(echo "$JSON" | jq \
            --arg key "SYSTEM_BASE_URL" \
            --arg value "$SYSTEM_BASE_URL" \
            '.[$key] = $value')

          COMPACT=$(echo "$JSON" | jq -c '.')



          # Outputs
          echo "env=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "compose_b64=$COMPOSE_B64" >> "$GITHUB_OUTPUT"
          echo "secrets_json=$SECRETS_JSON" >> "$GITHUB_OUTPUT"

          echo "Environment: $ENV_NAME"
          echo "Image: $IMAGE_TAG"


      # 3. Login + build + push
      - name: 3. Build & Push Docker Image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ steps.prepare.outputs.image_tag }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | \
            docker login docker.io \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin

          docker buildx create \
            --use \
            --name deployment-builder

          docker buildx inspect --bootstrap

          docker buildx build \
            --platform linux/amd64,linux/arm64/v8 \
            --tag "$IMAGE_TAG" \
            --push \
            .


      # 4. Trigger infrastructure deployment
      - name: 4. Trigger Infrastructure Deployment
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.INFRA_PAT }}
          repository: dime-consultants/infrastructure
          event-type: deploy-app
          client-payload: |
            {
              "app_repo": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "env": "${{ steps.prepare.outputs.env }}",
              "sha": "${{ github.sha }}",
              "image_tag": "${{ steps.prepare.outputs.image_tag }}",
              "docker_compose_b64": "${{ steps.prepare.outputs.compose_b64 }}",
              "env_secrets": ${{ steps.prepare.outputs.secrets_json }}
            }
