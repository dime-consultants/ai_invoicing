name: CI/CD — Docker build, push and deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kib4n4/ai_invoicing

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set short SHA tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push: true — this is the actual fix. The image now lives in a real
      # registry the remote host can pull from, instead of a tarball that has
      # to be SCP'd and `docker load`-ed under a hopeful tag match.
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Compose file + nginx conf live in the repo and get synced to the
      # server on every deploy, so the remote directory can never drift from
      # what's in git.
      - name: Sync compose files to server
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.yml,nginx/"
          target: "/root/tools/ai_invoicing"
          timeout: 120s

      - name: Deploy on remote
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /root/tools/ai_invoicing

            export IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            export IMAGE_NAME="ghcr.io/kib4n4/ai_invoicing"

            if [ -z "$IMAGE_TAG" ]; then
              echo "ERROR: IMAGE_TAG is empty" >&2
              exit 1
            fi

            echo "=== Deploying tag: ${IMAGE_TAG} ==="

            # ── 1. Free disk space only when critically low ────────────────
            FREE_KB=$(df / | awk 'NR==2 {print $4}')
            if [ "$FREE_KB" -lt 2097152 ]; then
              echo "Low disk space (${FREE_KB} KB free) — pruning unused Docker data..."
              # Avoid --volumes so we don't kill the Postgres volume
              timeout 90 docker system prune -af || true
            else
              echo "Disk space OK (${FREE_KB} KB free)"
            fi

            # ── 2. Backup DB (best-effort) ─────────────────────────────────
            BACKUP_DIR=/root/backups/db
            mkdir -p "$BACKUP_DIR"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)

            if docker compose ps db 2>/dev/null | grep -q "healthy\|running"; then
              echo "Backing up database..."
              if timeout 120 docker compose exec -T db pg_dump \
                   -U "${DB_USER:-postgres}" "${DB_NAME:-ai_invoicing}" \
                   | gzip > "$BACKUP_DIR/backup_${TIMESTAMP}.sql.gz"; then
                # Keep only the newest 7 backups
                ls -tp "$BACKUP_DIR"/*.sql.gz 2>/dev/null | grep -v '/$' | tail -n +8 | xargs -r rm --
                echo "Backup complete → backup_${TIMESTAMP}.sql.gz"
              else
                echo "WARNING: backup timed out or failed — continuing"
              fi
            else
              echo "DB not healthy/running — skipping backup"
            fi

            # ── 3. Pull the exact tagged image ─────────────────────────────
            echo "Pulling ${IMAGE_NAME}:${IMAGE_TAG}..."
            timeout 300 docker pull "${IMAGE_NAME}:${IMAGE_TAG}"
            docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${IMAGE_NAME}:latest"
            echo "Image ready"

            # ── 4. Run migrations + seed + collectstatic (one-shot) ────────
            # The migrate service in docker-compose.yml already does:
            #   migrate → seed_tools → collectstatic
            echo "Running migrations / seed / collectstatic..."
            timeout 300 docker compose run --rm --remove-orphans migrate
            echo "Migrations finished successfully"

            # ── 5. Restart the stack ───────────────────────────────────────
            echo "Restarting services..."
            timeout 180 docker compose up -d --remove-orphans
            echo "Services started"

            # ── 6. Wait for app healthcheck ────────────────────────────────
            echo "Waiting for app to become healthy..."
            ATTEMPTS=0
            MAX_ATTEMPTS=36          # 36 × 5 s = 3 minutes
            until [ "$(docker inspect -f '{{.State.Health.Status}}' invoicing-app 2>/dev/null)" = "healthy" ]; do
              ATTEMPTS=$((ATTEMPTS + 1))
              if [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]; then
                echo "ERROR: App did not become healthy within $((MAX_ATTEMPTS * 5)) seconds" >&2
                docker compose logs --tail=150 app
                docker compose ps
                exit 1
              fi
              echo "  attempt $ATTEMPTS/$MAX_ATTEMPTS — still waiting..."
              sleep 5
            done

            echo "=== Deploy complete. Live tag: ${IMAGE_TAG} ==="
            docker compose ps
