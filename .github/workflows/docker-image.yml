name: Build Image & Trigger K3s Deployment

on:
  push:
    branches:
      - master
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Collect static files
        run: |
          python manage.py collectstatic --noinput --clear

      - name: Run tests
        run: |
          python manage.py test

  build-and-trigger:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Validate that Docker Hub secrets exist.
      # Do NOT print the actual values.
      - name: Validate Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Error: DOCKERHUB_USERNAME is missing."
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Error: DOCKERHUB_TOKEN is missing."
            exit 1
          fi

          echo "Docker Hub credentials are configured."

      # Using password-stdin instead of docker/login-action
      # because of the malformed HTTP Authorization header issue.
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | \
            docker login docker.io \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin

      - name: Determine environment
        id: env
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" == "master" ]]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=stage" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate image tag
        id: tag
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE_NAME="invoicing"
          ENV_NAME="${{ steps.env.outputs.env }}"
          SHORT_SHA="${GITHUB_SHA::7}"

          IMAGE_TAG="${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${ENV_NAME}-${SHORT_SHA}"

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          echo "Generated image tag: $IMAGE_TAG"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.image_tag }}
          platforms: linux/amd64,linux/arm64/v8

      - name: Prepare deployment payload
        id: payload
        shell: bash
        env:
          APP_REPO: ${{ github.repository }}
          ENV_NAME: ${{ steps.env.outputs.env }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          PAYLOAD=$(jq -nc \
            --arg app_repo "$APP_REPO" \
            --arg env "$ENV_NAME" \
            --arg image_tag "$IMAGE_TAG" \
            --arg target_server "dime" \
            '{
              app_repo: $app_repo,
              env: $env,
              image_tag: $image_tag,
              target_server: $target_server
            }')

          {
            echo "client_payload<<EOF"
            echo "$PAYLOAD"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Infra PAT
        env:
          INFRA_PAT: ${{ secrets.INFRA_PAT }}
        run: |
          if [ -z "$INFRA_PAT" ]; then
            echo "Error: INFRA_PAT is missing."
            exit 1
          fi
          echo "Infra PAT is configured."

      - name: Trigger deployment in Infra repository
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.INFRA_PAT }}
          repository: dime-consultants/infrastructure
          event-type: deploy-app
          client-payload: ${{ steps.payload.outputs.client_payload }}
